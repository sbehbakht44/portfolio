<style>
  :root{
    --bg:#faf6ec;
    --ink:#211d24;
    --pink:#ef6f9e;
    --turq:#3fb8b0;
    --yellow:#f6c445;
    --purple:#8b6cd8;
    --coral:#ef7c5c;
    --line:#e1d9c9;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font-sans); color:var(--display-color); background:var(--bg); }

  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:clamp(18px,4vw,32px) clamp(20px,6vw,64px);
    padding-top:max(clamp(18px,4vw,32px), env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
  }
  nav .logo{ font-family:var(--font-display); font-style:italic; font-size:20px; text-decoration:none; color:var(--ink); }
  nav .links{ display:flex; gap:32px; font-size:16px; letter-spacing:.01em; }
  nav .links a{ color:var(--ink); text-decoration:none; opacity:.6; }
  nav .links a.is-active{ opacity:1; border-bottom:2px solid var(--coral); padding-bottom:3px; }

  .backbar{ max-width:1040px; margin:0 auto; padding:clamp(16px,3vw,28px) clamp(20px,6vw,64px) 0; }
  .backbar a{
    font-size:16px; font-weight:600; letter-spacing:.01em;
    color:var(--ink); opacity:.55; text-decoration:none;
  }
  .backbar a:hover{ opacity:.9; }

  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.22,.68,.16,1), transform .7s cubic-bezier(.22,.68,.16,1); }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .reveal{ transition:none !important; opacity:1 !important; transform:none !important; }
  }

  .res-shell{ max-width:840px; margin:0 auto; padding:clamp(24px,5vw,36px) clamp(20px,6vw,64px) clamp(60px,12vw,110px); text-align:left; }
  .res-eyebrow{
    font-size:16px; letter-spacing:.01em; color:var(--coral);
    font-weight:600; margin:0 0 16px; display:block;
  }
  .res-title{
    font-family:var(--font-display); font-weight:500; font-size:clamp(30px,7vw,46px); line-height:1.2; margin:0 0 16px;
  }
  .res-warmline{ font-family:var(--font-display); font-style:italic; font-size:20px; opacity:.75; margin:0 0 22px; }
  .res-prose p{ font-size:16px; line-height:1.75; opacity:.78; margin:0 0 36px; max-width:52ch; }

  .res-frame{
    display:inline-block; background:#fff; padding:14px; border-radius:16px;
    border:1px solid var(--line); box-shadow:0 14px 34px rgba(33,29,36,.14); margin:0 0 34px;
  }
  .res-frame img{ display:block; width:100%; max-width:640px; height:auto; border-radius:8px; }

  .res-cta{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .res-download{
    display:inline-flex; align-items:center; gap:10px; background:var(--pink); color:#fff;
    font-family:var(--font-sans); font-weight:600; font-size:16px; text-decoration:none;
    padding:14px 30px; border-radius:30px; box-shadow:0 8px 20px rgba(239,111,158,.35);
    transition:filter .15s, transform .15s;
  }
  .res-download:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .res-filenote{ font-size:16px; opacity:.5; }

  footer{ text-align:center; padding:40px 0 56px; font-size:16px; opacity:.4; }

  /* ============================================================
     DESIGN SYSTEM: single source of truth, applied to every page
     Type:   Bagel Fat One (display, #370000) · Work Sans (sans, body/UI)
             Caveat (handwritten, captions & small details only)
     Case:   sentence case everywhere; no all-caps
     Arrows: → forward · ← back · ↓ down
     ============================================================ */
  :root{
    /* type */
    --font-display:'Bagel Fat One', 'Baloo 2', system-ui, sans-serif;
    --font-sans:'Work Sans', system-ui, -apple-system, sans-serif;
    --font-hand:'Caveat', 'Bradley Hand', cursive;
    --display-color:#370000;

    /* color */
    --bg:#faf6ec;
    --ink:#211d24;
    --pink:#ef6f9e;
    --pink-deep:#df5687;
    --turq:#3fb8b0;
    --yellow:#f6c445;
    --purple:#8b6cd8;
    --coral:#ef7c5c;
    --line:#e1d9c9;

    /* text opacity roles */
    --o-body:.78;
    --o-muted:.6;
    --o-faint:.45;

    /* spacing scale */
    --s-1:4px;  --s-2:8px;  --s-3:12px; --s-4:16px;
    --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px; --s-9:80px;

    /* radii + motion */
    --r-sm:8px; --r-md:14px; --r-pill:999px;
    --ease:cubic-bezier(.22,.68,.16,1);
  }

  /* ---------- 1. TYPE ROLES ---------- */
  body{ font-family:var(--font-sans); font-weight:300; }

  /* display = headings & display type only */
  nav .logo,
  h1, h2,
  .ab-title, .ab-warmline,
  .res-title, .res-warmline,
  .hero-typed,
  .project-head h1,
  .projects-head h2,
  .project-item h3,
  .next .title,
  .overview h2,
  .idx,
  .problem-lede{
    font-family:var(--font-display) !important;
    color:var(--display-color);
  }

  /* subheadings = Work Sans, not the display face -- still the reading-brown ink */
  .subhead2, h3.subhead2,
  .details-card h3{
    font-family:var(--font-sans) !important;
    font-weight:600;
    color:var(--display-color);
  }

  /* handwritten = captions and small delight details only */
  .ab-photo-cap,
  .gallery-cap{
    font-family:var(--font-hand) !important;
  }

  /* sans, body copy = light weight for comfortable reading at length */
  .dek, .support-text, .wrapup-text,
  .concept-text, .z-text, .tool-or,
  .ab-prose p, .res-prose p, .project-item p, .overview p{
    font-family:var(--font-sans);
    font-weight:300;
  }

  /* sans, UI text = nav, buttons, labels, values: kept heavier so small type stays legible */
  nav .links, nav .links a,
  .backbar a, .to-work, .ic-readmore, .link-arrow,
  .tags, .credit,
  .eyebrow, .ab-eyebrow, .res-eyebrow,
  .label, .d-label, .d-value, .ic-label, .ic-value, .pathways-label,
  .btn, .wrapup-btn, .res-download{
    font-family:var(--font-sans);
    font-weight:500;
  }

  /* ---------- 2. NO ALL-CAPS, ANYWHERE ---------- */
  *{ text-transform:none !important; }

  /* ---------- 3. LABELS & EYEBROWS (consistent small type) ---------- */
  .eyebrow, .ab-eyebrow, .res-eyebrow{
    font-size:16px; font-weight:600; letter-spacing:.01em;
    color:var(--coral); display:block;
  }
  .label, .d-label, .ic-label, .pathways-label, .next .label{
    font-size:16px; font-weight:600; letter-spacing:.01em;
  }
  .ab-photo-cap, .gallery-cap{
    letter-spacing:0; font-weight:600;
  }

  /* ---------- 4. NAVIGATION ---------- */
  nav .links{ font-size:16px; letter-spacing:.01em; }
  nav .links a{
    color:var(--ink); text-decoration:none; opacity:var(--o-muted);
    transition:opacity .2s var(--ease);
  }
  nav .links a:hover{ opacity:1; }
  nav .links a.is-active{
    opacity:1; border-bottom:2px solid var(--coral); padding-bottom:3px;
  }

  /* ---------- 5. ARROWS: one look everywhere ---------- */
  /* every arrow in the site is one of: → forward · ← back · ↓ down,
     always rendered in the sans face at a consistent size and weight */
  .arrow, .arrow-glyph{
    font-family:var(--font-sans) !important;
    font-weight:400; line-height:1; display:inline-block;
    transition:transform .2s var(--ease), opacity .2s var(--ease);
  }
  .arrow{ font-size:19px; color:var(--pink); opacity:.75; }
  .arrow-glyph{ font-size:1em; }
  a:hover > .arrow, .project-item:hover .arrow{ opacity:1; transform:translateX(3px); }
  a:hover .arrow-glyph{ transform:translateX(2px); }
  .backbar a:hover .arrow-glyph, .to-work:hover .arrow-glyph{ transform:translateX(-2px); }
  .res-download:hover .arrow-glyph{ transform:translateY(2px); }

  /* text link that ends in an arrow (back links, "next", read-more) */
  .backbar a, .to-work, .ic-readmore, .link-arrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:16px; font-weight:600; letter-spacing:.01em;
    color:var(--ink); text-decoration:none; opacity:var(--o-muted);
    transition:opacity .2s var(--ease);
  }
  .backbar a:hover, .to-work:hover, .ic-readmore:hover, .link-arrow:hover{ opacity:1; }

  /* ---------- 6. BUTTONS: one base, two variants ---------- */
  .btn, .wrapup-btn, .res-download{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    padding:13px 26px; border-radius:var(--r-pill);
    font-size:16px; font-weight:600; letter-spacing:.01em; line-height:1;
    text-decoration:none; border:1.5px solid var(--ink); background:transparent;
    color:var(--ink); opacity:1;
    box-shadow:none;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease),
               background-color .2s var(--ease), color .2s var(--ease),
               border-color .2s var(--ease);
  }
  .btn:hover, .wrapup-btn:hover, .res-download:hover{
    transform:translateY(-2px); box-shadow:0 8px 18px rgba(33,29,36,.13);
  }
  /* solid variant */
  .btn--solid, .wrapup-btn--solid, .res-download{
    background:var(--pink); border-color:var(--pink); color:#fff;
  }
  .btn--solid:hover, .wrapup-btn--solid:hover, .res-download:hover{
    background:var(--pink-deep); border-color:var(--pink-deep); color:#fff;
    box-shadow:0 8px 20px rgba(239,111,158,.34);
  }

  /* editing-toolbar buttons follow the same shape, quieter palette */

  /* ---------- 7. FOOTER ---------- */
  footer{
    font-family:var(--font-sans); font-size:16px; letter-spacing:.01em;
    font-weight:300;
    opacity:var(--o-faint); text-align:center;
  }


  /* ============================================================
     8. RESPONSIVE FOUNDATION
     Fluid, intent-based rules layered on the design system above.
     These interpolate continuously with clamp()/minmax() rather than
     jumping at fixed breakpoints; a media query is used only where a
     layout genuinely needs to change shape (grid column count, nav
     orientation), not to re-declare sizes.
     ============================================================ */

  /* comfortable touch targets on every text link, without changing
     how any of them look */
  nav .links a, .backbar a, .next a, .to-work, .ic-readmore, .link-arrow{
    padding-block:8px; margin-block:-8px;
  }

  /* nav: below ~640px the logo and links stack into a deliberate
     two-row lockup instead of being forced into one cramped row or
     wrapping unpredictably */
  @media (max-width:640px){
    nav{ flex-direction:column; align-items:flex-start; row-gap:10px; }
    nav .links{ width:100%; gap:22px; }
  }

  /* hero-image: fluid inset + fluid min-height so a short/narrow
     mobile viewport never gets a hero that is taller than it needs
     to be, or an inset that eats most of the width */
  .hero-image{
    width:calc(100% - clamp(40px,10vw,200px));
    margin:clamp(24px,6vw,48px) auto clamp(48px,10vw,96px);
    min-height:clamp(220px,45vw,420px);
  }

  /* zigzag/provider/wrapup two-up rows: once they've stacked to one
     column, the desktop gap between media and text is too much
     vertical air -- tighten it only in that stacked state */
  @media (max-width:860px){
    .zigzag-row, .zigzag-row.z-reverse,
    .provider-photo-row, .wrapup-row{ gap:32px; }
  }

  /* card grids: an extra step below the existing 2-column breakpoint
     so small phones never get a cramped 2-up grid */
  @media (max-width:480px){
    .card-row, .card-row--three{ grid-template-columns:1fr; }
  }

  /* project-item (homepage list): the desktop layout is a fixed
     200px/56px/1fr/auto grid that cannot fit a phone screen. Below
     600px it becomes a 2-column grid -- thumbnail spanning two rows,
     index number and arrow sharing the top row, title/description
     below -- so every piece of content stays visible, just
     rearranged. */
  @media (max-width:600px){
    .project-item{
      grid-template-columns:96px 1fr; column-gap:16px; row-gap:6px; padding:22px 0;
    }
    .project-item .thumb{ width:96px; height:72px; grid-column:1; grid-row:1 / 3; }
    .project-item .idx{ grid-column:2; grid-row:1; align-self:end; }
    .project-item > div{ grid-column:2; grid-row:2; }
    .project-item .arrow{ grid-column:2; grid-row:1; justify-self:end; }
  }
</style>

<script>
(function(){
  var els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){
    els.forEach(function(el){ el.classList.add('is-visible'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  els.forEach(function(el){ io.observe(el); });
})();
</script>
