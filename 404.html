<style>
  :root{
    --font-serif:'Newsreader', Georgia, 'Times New Roman', serif;
    --font-sans:'Inter', system-ui, -apple-system, sans-serif;
    --font-hand:'Caveat', 'Bradley Hand', cursive;
    --bg:#faf6ec; --ink:#211d24; --pink:#ef6f9e; --pink-deep:#df5687;
    --coral:#ef7c5c; --line:#e1d9c9;
    --ease:cubic-bezier(.22,.68,.16,1);
  }
  *{ box-sizing:border-box; text-transform:none; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:var(--bg); color:var(--ink); font-family:var(--font-sans); padding:24px;
  }
  .eyebrow{ font-size:13px; font-weight:600; letter-spacing:.01em; color:var(--coral); margin:0 0 18px; }
  h1{ font-family:var(--font-serif); font-weight:500; font-size:clamp(34px,6vw,56px); line-height:1.15; margin:0 0 14px; }
  p{ font-size:16px; opacity:.72; max-width:44ch; margin:0 0 34px; line-height:1.6; }
  .hand{ font-family:var(--font-hand); font-size:22px; opacity:.65; display:block; margin-top:6px; }
  .btn{
    display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border-radius:999px;
    font-family:var(--font-sans); font-size:13.5px; font-weight:600; letter-spacing:.01em; line-height:1;
    text-decoration:none; background:var(--pink); border:1.5px solid var(--pink); color:#fff;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease);
  }
  .btn:hover{ transform:translateY(-2px); background:var(--pink-deep); border-color:var(--pink-deep);
    box-shadow:0 8px 20px rgba(239,111,158,.34); }
  .arrow-glyph{ font-size:1em; display:inline-block; }
</style>
